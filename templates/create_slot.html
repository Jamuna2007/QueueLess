<!DOCTYPE html>
<html>
<head>
    <title>Create Meal Slot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 mx-auto shadow" style="max-width:450px">
        <h2>Create Meal Slot</h2>

        {% with messages = get_flashed_messages() %}
        {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>Meal Type</label>
            <select name="meal_type" class="form-select mb-3" required>
                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Dinner</option>
            </select>

            <label>Date</label>
            <input type="date" name="date" class="form-control mb-3" required>

            <label>Start Time</label>
            <input type="time" name="start_time" class="form-control mb-3" required>

            <label>Capacity</label>
            <input type="number" name="capacity" min="1" class="form-control mb-3" required>

            <button class="btn btn-primary w-100">Create Slot</button>
        </form>

        <a href="/admin" class="mt-3">Back to Admin</a>
    </div>
</div>

</body>
</html>
