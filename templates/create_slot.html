<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Meal Slot | QueueLess</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">
            <i class="bi bi-egg-fried"></i> QueueLess Admin
        </a>

        <a href="/admin" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Dashboard
        </a>
    </div>
</nav>

<div class="container create-slot-container">

    <div class="create-slot-heading">
        <div class="create-slot-icon">
            <i class="bi bi-calendar-plus"></i>
        </div>

        <h2>Create Meal Slot</h2>
        <p>Add a new meal schedule for students and staff.</p>
    </div>

    <div class="create-slot-card">

        {% with messages = get_flashed_messages() %}
        {% for message in messages %}
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> {{ message }}
        </div>
        {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-cup-hot"></i> Meal Type
                </label>

                <select name="meal_type" class="form-select" required>
                    <option value="" disabled selected>Select Meal Type</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-calendar-event"></i> Date
                </label>

                <input type="date" name="date" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-clock"></i> Start Time
                </label>

                <input type="time" name="start_time" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-people"></i> Maximum Capacity
                </label>

                <input type="number" name="capacity" min="1"
                       class="form-control" placeholder="Enter available seats" required>
            </div>

            <button type="submit" class="btn create-slot-btn w-100">
                <i class="bi bi-plus-circle"></i> Create Meal Slot
            </button>

        </form>

        <a href="/admin" class="create-slot-back">
            <i class="bi bi-arrow-left"></i> Back to Admin Dashboard
        </a>

    </div>

</div>

</body>
</html>
