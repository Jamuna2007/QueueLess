<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create User | QueueLess</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">
            <i class="bi bi-egg-fried"></i> QueueLess Admin
        </a>

        <a href="/admin" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Dashboard
        </a>
    </div>
</nav>

<div class="container create-user-container">

    <div class="create-user-heading">
        <div class="create-user-icon">
            <i class="bi bi-person-plus-fill"></i>
        </div>

        <h2>Create User Account</h2>
        <p>Add a new student, teacher or administrator to QueueLess.</p>
    </div>

    <div class="create-user-card">

        {% with messages = get_flashed_messages() %}
        {% for message in messages %}
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> {{ message }}
        </div>
        {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-person"></i> Full Name
                </label>

                <input name="name" type="text"
                       class="form-control"
                       placeholder="Enter full name" required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-envelope"></i> Email Address
                </label>

                <input name="email" type="email"
                       class="form-control"
                       placeholder="Enter email address" required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-lock"></i> Password
                </label>

                <div class="password-wrapper">
                    <input name="password" type="password"
                           id="adminPassword"
                           class="form-control"
                           placeholder="Create a password" required>

                    <i class="bi bi-eye password-toggle"
                       onclick="toggleAdminPassword()"></i>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-person-badge"></i> Select User Role
                </label>

                <select name="role" class="form-select" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn create-user-btn w-100">
                <i class="bi bi-person-check-fill"></i> Create Account
            </button>

        </form>

        <a href="/admin" class="create-user-back">
            <i class="bi bi-arrow-left"></i> Back to Admin Dashboard
        </a>

    </div>

</div>

<script>
function toggleAdminPassword() {
    const password = document.getElementById("adminPassword");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
</script>

</body>
</html>
