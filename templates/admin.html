<!DOCTYPE html>
<html>
<head>
    <title>QueueLess Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>Admin Dashboard</h2>
    <p>QueueLess Management Panel</p>

    <div class="row">
        <div class="col-md-4 mb-3">
            <div class="card p-3 shadow">
                <h5>Total Users</h5>
                <h2>{{ total_users }}</h2>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card p-3 shadow">
                <h5>Total Bookings</h5>
                <h2>{{ total_bookings }}</h2>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card p-3 shadow">
                <h5>Active Bookings</h5>
                <h2>{{ active_bookings }}</h2>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card p-3 shadow">
                <h5>Checked In</h5>
                <h2>{{ checked_in }}</h2>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card p-3 shadow">
                <h5>No Shows</h5>
                <h2>{{ no_shows }}</h2>
            </div>
        </div>
    </div>

    <a href="/admin/create-slot" class="btn btn-primary mb-2">Create Meal Slot</a>
    <a href="/admin/create-user" class="btn btn-success mb-2">Create User</a>
    <a href="/admin/report" class="btn btn-info mb-2">View Reports</a>
    <a href="/logout" class="btn btn-danger mb-2">Logout</a>
</div>

</body>
</html>
