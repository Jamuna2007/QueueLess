<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | QueueLess</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="login-page">

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-logo">
            <i class="bi bi-egg-fried"></i>
        </div>

        <h2 class="text-center fw-bold">Create Account</h2>

        <p class="text-center text-muted mb-4">
            Join QueueLess and reserve your meals easily.
        </p>

        {% with messages = get_flashed_messages() %}
        {% for message in messages %}
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> {{ message }}
        </div>
        {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="name"
                           class="form-control"
                           placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" name="email"
                           class="form-control"
                           placeholder="Enter your email" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>

                <div class="password-wrapper">
                    <input type="password" name="password"
                           id="registerPassword"
                           class="form-control"
                           placeholder="Create a password" required>

                    <i class="bi bi-eye password-toggle"
                       onclick="toggleRegisterPassword()"></i>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Register As</label>

                <select name="role" class="form-select" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher / Staff</option>
                </select>
            </div>

            <button type="submit" class="btn login-btn w-100">
                <i class="bi bi-person-plus"></i> Create Account
            </button>

        </form>

        <p class="text-center mt-4 mb-0">
            Already registered?
            <a href="/login" class="fw-bold">Login</a>
        </p>

    </div>

</div>

<script>
function toggleRegisterPassword() {
    const password = document.getElementById("registerPassword");

    password.type = password.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
