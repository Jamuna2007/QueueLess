\<!DOCTYPE html>

\<html> \<head>     \<title>QueueLess - Register\</title>     \<link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css)" rel="stylesheet"> \</head> \<body class="bg-light">

\<div class="container mt-5">     \<div class="card mx-auto p-4 shadow" style="max-width:400px">         \<h2 class="text-center">Create Account\</h2>

```
    {% with messages = get_flashed_messages() %}
    {% for message in messages %}
    <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
    {% endwith %}

    <form method="POST">
        <input class="form-control mb-3" name="name" placeholder="Full Name" required>
        <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
        <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>

        <select class="form-select mb-3" name="role">
            <option value="student">Student</option>
            <option value="teacher">Teacher / Staff</option>
        </select>

        <button class="btn btn-success w-100">Register</button>
    </form>

    <p class="text-center mt-3">
        Already registered? <a href="/login">Login</a>
    </p>
</div>
